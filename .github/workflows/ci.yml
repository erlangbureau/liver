name: Liver build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    ## Every Monday at 2am.
    - cron: 0 2 * * 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Liver
    if: ${{ !cancelled() }}
    uses: ninenines/ci.erlang.mk/.github/workflows/ci.yaml@master

  rebar3:
    name: rebar3 (OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          ## Oldest and latest supported OTP, each with its newest rebar3.
          - otp: '25'
            rebar3: '3.24.0'
          - otp: '29'
            rebar3: '3.28.0'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Erlang/OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: ${{ matrix.otp }}
        rebar3-version: ${{ matrix.rebar3 }}
        version-type: loose

    - name: Run tests with rebar3
      run: rebar3 ct --dir tests

  coverage:
    name: Coverage Report
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Erlang/OTP
      uses: erlef/setup-beam@v1
      with:
        otp-version: '27'
        version-type: loose

    - name: Install dependencies
      run: make

    - name: Run tests with coverage
      run: make tests

    - name: Upload coverage to Coveralls
      env:
        COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: make coveralls-send
